[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "minidb"
version = "0.1.0"
description = "A crash-safe, zero-dependency relational database engine built from scratch in Python"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
